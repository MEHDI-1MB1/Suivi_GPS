services:
  spark-master:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8090:8080"   # UI master
      - "7077:7077"
    volumes:
      - ./spark-jobs:/opt/src
      - ./data/csv:/opt/data
      - ./benchmarks/results:/opt/results
      - ./benchmarks:/opt/benchmarks
    networks: [fleet]

  spark-worker1:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-worker1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on: [spark-master]
    volumes:
      - ./spark-jobs:/opt/src
      - ./data/csv:/opt/data
    networks: [fleet]

  spark-worker2:
    image: apache/spark:${SPARK_VERSION}
    container_name: spark-worker2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    depends_on: [spark-master]
    volumes:
      - ./spark-jobs:/opt/src
      - ./data/csv:/opt/data
    networks: [fleet]

networks:
  fleet:
    external: true
    name: fleet-telematics-team_fleet-net
